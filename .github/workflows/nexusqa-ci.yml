name: CI - NexusQA Docker

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build-y-prueba:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Crear .env de prueba a partir de .env.example
        run: cp .env.example .env

      - name: Validar docker-compose.yml
        run: docker compose config --quiet

      - name: Construir la imagen de la API (docker build)
        run: docker build -t nexusqa-api:ci ./QACopilot

      - name: Construir las imágenes con Docker Compose
        run: docker compose build

      - name: Levantar los contenedores
        run: docker compose up -d --wait

      - name: Prueba de comunicación api -> sqlserver (registro e inicio de sesión)
        run: bash scripts/prueba-nexusqa.sh

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs

      - name: Apagar y limpiar
        if: always()
        run: docker compose down -v
