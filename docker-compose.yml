# NexusQA con Docker: API .NET (contenedor 1) + SQL Server (contenedor 2)
services:
  # Contenedor 1: API de NexusQA
  api:
    build:
      context: ./QACopilot
      dockerfile: Dockerfile
    image: nexusqa-api:1.0.0
    container_name: nexusqa-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development # habilita Swagger en /swagger
      # La API llega a la base de datos por el NOMBRE DEL SERVICIO "sqlserver", no por localhost ni IP
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=NexusQA;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False;"
      Database__ApplyMigrations: "true" # crea las tablas al arrancar
      JwtSettings__SecretKey: ${JWT_SECRET_KEY}
      Security__EncryptionKey: ${ENCRYPTION_KEY}
      Cors__AllowedOrigins__0: http://localhost:4200
    ports:
      - "${API_PORT:-5199}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - red-nexusqa
    restart: unless-stopped

  # Contenedor 2: base de datos SQL Server
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04
    container_name: nexusqa-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - datos-sqlserver:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    networks:
      - red-nexusqa
    restart: unless-stopped

networks:
  red-nexusqa:
    name: red-nexusqa
    driver: bridge

volumes:
  datos-sqlserver:
    name: datos-sqlserver
