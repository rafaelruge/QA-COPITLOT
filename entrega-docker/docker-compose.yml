services:
  # Contenedor 1: la aplicación (API de notas)
  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    image: notas-api:1.0.0
    container_name: notas-app
    env_file: .env
    environment:
      DB_HOST: db # nombre del servicio de la base de datos (no localhost)
      DB_PORT: 5432
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - red-notas
    restart: unless-stopped

  # Contenedor 2: base de datos PostgreSQL
  db:
    image: postgres:16.4-alpine3.20
    container_name: notas-db
    env_file: .env
    volumes:
      - datos-postgres:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - red-notas
    restart: unless-stopped

# Red propia: dentro de ella los contenedores se encuentran por nombre de servicio
networks:
  red-notas:
    name: red-notas
    driver: bridge

# Volumen para que los datos sobrevivan aunque se borre el contenedor
volumes:
  datos-postgres:
    name: datos-postgres
